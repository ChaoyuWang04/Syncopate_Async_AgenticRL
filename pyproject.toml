[project]
name = "syncopate"
version = "0.1.0"
description = "Async agentic RL on verl — ad-campaign agent with a stateful sandbox and rule-based verifier"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "pyarrow>=15.0",
    "pandas>=2.0",
]

[project.optional-dependencies]
# ⚠️ numpy 的下界是刻意写死的，不要删。
# verl 0.8.0 的 setup.py 钉了 `numpy<2.0.0`（老师的 0.8.0.dev 快照同样），
# 但那是条陈旧的钉：装上 numpy 1.26 会连锁打断 scipy 1.18（它自己要求 numpy>=2.0），
# 进而 transformers 导入失败，最后 verl 自己也 import 不了。
# torch 2.9 / vLLM 0.12 / scipy 1.18 全是 numpy-2 原生的，实测 numpy 2.2.6 整条栈正常。
train = ["vllm==0.12.0", "verl==0.8.0", "numpy>=2.2,<3"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["syncopate"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
